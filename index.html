<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GFA Turkey Bowl</title>
<style>
:root{
  --bg:#2b2b2d;--nav:#111;--strip:#1c1c1c;--orange:#f46c22;--green:#53d337;
  --add:#2a8a33;--red:#d0312d;--row:#f4f4f6;--rowb:#dfdfe3;--th:#d5d5d9;
  --ink:#1e1e1e;--sub:#6e6e73;--cond:"Roboto Condensed","Arial Narrow","Helvetica Neue Condensed",Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:#fff;font-family:"Open Sans","Segoe UI",Helvetica,Arial,sans-serif;font-size:13px;-webkit-font-smoothing:antialiased;min-height:100%}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
input{font-family:inherit;color:var(--ink)}
.hide{display:none!important}
.r{text-align:right}

.nav{background:var(--nav);height:56px;position:sticky;top:0;z-index:30}
.navin{max-width:1060px;margin:0 auto;height:100%;display:flex;align-items:stretch;gap:36px;padding:0 20px}
.navtab{color:#e9e9e9;font-weight:700;font-size:15px;display:flex;align-items:center;border-bottom:3px solid transparent;padding-top:3px}
.navtab.on{color:#fff;border-bottom-color:var(--green)}
.navtab:hover{color:#fff}

.ch{max-width:1060px;margin:0 auto;padding:54px 20px 34px;display:flex;justify-content:space-between;align-items:flex-start;gap:20px}
.ch h1{font-size:22px;font-weight:700;letter-spacing:-.1px}
.meta{display:flex;gap:16px;margin-top:8px;font-size:11px;color:#a9a9ae}
.meta b{font-weight:600;color:#fff2b8;margin-left:3px}
.live{text-align:center;min-width:120px}
.lk{font-size:11px;color:#d8d8dc;text-transform:uppercase}
.lv{font-size:22px;font-weight:700;margin-top:4px}
.lv.open{color:var(--green)}
.lv.live2{color:var(--orange)}

.page{max-width:1060px;margin:0 auto;padding:0 20px 60px;display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:18px;align-items:start}
.tools{height:28px;margin-bottom:8px;display:flex;align-items:center;gap:10px}
.srch{position:relative;width:205px;height:24px;background:#fff}
.srch svg{position:absolute;left:7px;top:6px;color:#333}
.srch input{width:100%;height:100%;border:0;outline:0;padding:0 8px 0 27px;font-size:11.5px;background:transparent}
.sx{color:#fff;font-size:20px;line-height:1;width:20px}
.ptabs{background:var(--strip);height:26px;display:flex}
.ptab{min-width:26px;padding:0 9px;height:26px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;color:#c9c9cd}
.ptab:hover{color:#fff}
.ptab.on{background:var(--orange);color:#fff}

.th{background:var(--th);color:#333;font-size:10px;text-transform:uppercase;height:22px;font-weight:400}
.th [data-sort]{cursor:pointer;user-select:none}
.th .sorted{font-weight:700;color:#000}
.th .sorted::after{content:"";display:inline-block;margin-left:4px;vertical-align:middle;border-left:3.5px solid transparent;border-right:3.5px solid transparent}
.th .sorted.desc::after{border-top:4px solid #000}
.th .sorted.asc::after{border-bottom:4px solid #000}

.row{display:grid;grid-template-columns:minmax(0,1fr) 42px 138px 138px 46px 62px 30px;align-items:center;padding:0 0 0 10px}
.plist{background:var(--row);height:min(470px,calc(100vh - 300px));min-height:320px;overflow-y:auto}
.prow{height:27px;border-bottom:1px solid var(--rowb);color:var(--ink);cursor:pointer;font-size:12px}
.prow:hover{background:#e8e8ec}
.prow.on{background:#e1f2db}
.prow.dim{opacity:.38;cursor:default}
.cl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:8px;display:flex;align-items:center;min-width:0}
.cl>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c-pos{color:var(--ink)}
.c-tm{color:#3a3a3e;font-size:11.5px}
.c-add{display:flex;justify-content:center}
.add{width:18px;height:18px;border-radius:50%;background:var(--add);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.add.rm{background:var(--red)}
.add.off{background:#bdbdc2}
.lg{width:15px;height:15px;object-fit:contain;margin-right:5px;flex:none}
.opp{cursor:pointer}
.opp:hover,.opp.on{text-decoration:underline}

.lutabs{height:28px;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.lutab{height:24px;padding:0 9px;display:flex;align-items:center;gap:6px;background:#3d3d40;color:#d0d0d4;font-family:var(--cond);font-stretch:condensed;font-weight:700;font-size:12.5px;text-transform:uppercase;cursor:pointer;white-space:nowrap}
.lutab:hover{color:#fff}
.lutab.on{background:var(--orange);color:#fff}
.dot{width:6px;height:6px;border-radius:50%;background:#77777c}
.dot.ok{background:var(--green)}
.lutab.on .dot:not(.ok){background:#ffd3bb}
.tx{font-size:14px;line-height:1;opacity:.7}
.tx:hover{opacity:1}
.luadd{width:24px;height:24px;background:#3d3d40;color:#d0d0d4;display:flex;align-items:center;justify-content:center}
.luadd:hover{color:#fff}
.luh{background:var(--strip);height:30px;display:flex;align-items:center;justify-content:space-between;padding:0 10px}
.lut{flex:none;max-width:45%;font-family:var(--cond);font-stretch:condensed;font-weight:700;font-size:15px;letter-spacing:.2px;text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:10px}
.lus{font-size:11.5px;color:#e2e2e6;display:flex;align-items:center;gap:7px;white-space:nowrap}
.lus b{font-weight:400;font-size:13.5px;color:var(--green);margin-left:3px}
.lus b.neg{color:#ff5a4f}
.lus i{width:1px;height:18px;background:#6a6a6e}
.srow2{display:grid;grid-template-columns:44px minmax(0,1fr) 68px 26px;align-items:center;padding:0 0 0 10px}
.slots{background:var(--row)}
.slot{height:27px;border-bottom:1px solid var(--rowb);color:var(--ink);font-size:12px;cursor:pointer}
.slot:hover{background:#e8e8ec}
.slot .x{color:#8a8a90;font-size:15px;line-height:1;display:flex;justify-content:center}
.slot .x:hover{color:var(--red)}
.act{display:flex;gap:8px;margin-top:14px}
.act input{flex:1;min-width:0;height:30px;border:0;outline:0;padding:0 9px;font-size:13px;background:#fff}
.enter{height:30px;min-width:150px;background:var(--green);color:#111;font-family:var(--cond);font-stretch:condensed;font-weight:700;font-size:17px;text-transform:uppercase;letter-spacing:.2px}
.enter:hover{background:#4bc22f}
.enter:disabled{background:#5d5d61;color:#a3a3a8;cursor:default}
.clr{display:flex;align-items:center;gap:5px;color:#d6d6da;font-size:14px;margin-top:14px}
.clr:hover{color:#fff}

.srow{display:grid;grid-template-columns:56px minmax(0,1fr) 80px 70px;align-items:center;padding:0 10px}
.sent{height:27px;border-bottom:1px solid var(--rowb);color:var(--ink);cursor:pointer;font-size:12px}
.sent:hover{background:#e8e8ec}
.sent.on{background:#e1f2db}
.s-pts{font-weight:700}
.drow{display:grid;grid-template-columns:44px minmax(0,1fr) 74px 58px;align-items:center;padding:0 10px}
.dl{height:27px;border-bottom:1px solid var(--rowb);color:var(--ink);font-size:12px}
.dl .b{font-weight:700}

.pop{position:fixed;z-index:40;width:260px;background:var(--row);box-shadow:0 8px 26px rgba(0,0,0,.45);pointer-events:none;color:var(--ink)}
.pop-h{background:var(--strip);color:#fff;height:30px;display:flex;align-items:center;padding:0 10px;font-family:var(--cond);font-stretch:condensed;font-weight:700;font-size:14px;text-transform:uppercase}
.pop-h .lg{width:18px;height:18px;margin-right:7px}
.pop-r{display:grid;grid-template-columns:34px minmax(0,1fr) 58px;align-items:center;height:26px;padding:0 10px;border-bottom:1px solid var(--rowb);font-size:12px}
.pop-r:last-child{border-bottom:0}
.pop-dl{grid-template-columns:34px minmax(0,1fr);height:auto;min-height:26px;padding-top:6px;padding-bottom:6px;color:var(--sub)}

.ov{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal{background:var(--bg);width:340px;max-width:100%;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.mh{background:var(--strip);height:34px;display:flex;align-items:center;padding:0 12px;font-family:var(--cond);font-stretch:condensed;font-weight:700;font-size:16px;text-transform:uppercase}
.mbd{padding:18px 14px 14px}
.mb{color:#e2e2e6;font-size:14px;margin-bottom:16px}
.mbtns{display:flex;flex-direction:column;gap:8px}
.mbtns button{height:32px;font-family:var(--cond);font-stretch:condensed;font-weight:700;font-size:16px;text-transform:uppercase}
.mgo{background:var(--green);color:#111}
.mgo:hover{background:#4bc22f}
.mdone{background:#4d4d50;color:#fff}
.mdone:hover{background:#5a5a5e}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--red);color:#fff;font-weight:600;padding:10px 16px;opacity:0;pointer-events:none;transition:.2s;z-index:60;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media(max-width:1000px){
  .row{grid-template-columns:minmax(0,1fr) 38px 112px 112px 42px 58px 28px}
}
@media(max-width:900px){
  .page{grid-template-columns:1fr}
  .plist{height:55vh}
  .ch{padding:28px 16px 22px;flex-wrap:wrap}
  .live{text-align:left;min-width:0}
  .page{padding:0 12px 40px}
}
@media(max-width:560px){
  .row{grid-template-columns:minmax(0,1fr) 30px 92px 38px 54px 26px;padding-left:8px}
  .row .c-team{display:none}
  .meta{flex-wrap:wrap;gap:6px 14px}
  .enter{min-width:110px}
  .lus{font-size:11px;gap:6px}
  .lus b{font-size:12.5px}
}
</style>
</head>
<body>

<nav class="nav"><div class="navin">
  <button class="navtab on" data-v="lineup" id="navLineup">Lineup</button>
  <button class="navtab" data-v="standings" id="navStand">Standings</button>
</div></nav>

<header class="ch">
  <div>
    <h1 id="cTitle"></h1>
    <div class="meta">
      <span>Entries:<b id="mEntries">0</b></span>
      <span>Salary Cap:<b id="mCap"></b></span>
      <span>Max Entries:<b id="mMax"></b></span>
    </div>
  </div>
  <div class="live">
    <div class="lk">Status</div>
    <div class="lv" id="mStatus"></div>
  </div>
</header>

<main class="page" id="vLineup">
  <section>
    <div class="tools">
      <div class="srch">
        <svg width="12" height="12" viewBox="0 0 16 16"><circle cx="6.8" cy="6.8" r="5.3" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="M10.8 10.8l4 4" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>
        <input id="q" placeholder="Player Search" autocomplete="off">
      </div>
      <button class="sx" id="qx">&times;</button>
    </div>
    <div class="ptabs" id="ptabs"></div>
    <div class="row th" id="phead">
      <div data-sort="name">Player</div>
      <div data-sort="pos">Pos</div>
      <div class="c-team" data-sort="team">Team</div>
      <div data-sort="opp">Opp</div>
      <div class="r" data-sort="bid">Bid</div>
      <div class="r" data-sort="salary">Salary</div>
      <div></div>
    </div>
    <div class="plist" id="plist"></div>
  </section>

  <aside>
    <div class="lutabs" id="lutabs"></div>
    <div class="luh">
      <span class="lut">Lineup</span>
      <span class="lus">Avg. Rem./Player:<b id="avgRem"></b><i></i>Rem. Salary:<b id="remSal"></b></span>
    </div>
    <div class="srow2 th"><div>Pos</div><div>Player</div><div class="r">Salary</div><div></div></div>
    <div class="slots" id="slots"></div>
    <div class="act">
      <input id="uname" placeholder="Discord Name" maxlength="32" autocomplete="off">
      <button class="enter" id="bEnter">Enter</button>
    </div>
    <button class="clr" id="bClear"><svg width="14" height="14" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M3.6 12.4l8.8-8.8" stroke="currentColor" stroke-width="1.6"/></svg>Clear</button>
  </aside>
</main>

<main class="page hide" id="vStand">
  <section>
    <div class="tools">
      <div class="srch">
        <svg width="12" height="12" viewBox="0 0 16 16"><circle cx="6.8" cy="6.8" r="5.3" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="M10.8 10.8l4 4" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>
        <input id="sq" placeholder="Entry Search" autocomplete="off">
      </div>
    </div>
    <div class="ptabs"><span class="ptab on">Standings</span></div>
    <div class="srow th"><div>Rank</div><div>Entry</div><div class="r">Salary</div><div class="r">FPTS</div></div>
    <div class="plist" id="slist"></div>
  </section>
  <aside>
    <div class="lutabs"></div>
    <div id="sdetail"></div>
  </aside>
</main>

<div class="ov hide" id="ov">
  <div class="modal">
    <div class="mh" id="mt"></div>
    <div class="mbd">
      <div class="mb" id="mb"></div>
      <div class="mbtns"><button class="mgo hide" id="mnext"></button><button class="mdone" id="mok">Done</button></div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>
<div class="pop hide" id="pop"></div>

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const r2 = n => Math.round(n * 100) / 100;
const fmtPts = n => n == null ? "-" : r2(n).toFixed(2);
const key = s => String(s).trim().toLowerCase();
const LS_ENT = "contest_entries_v1", LS_NAME = "contest_name_v1";
const PLUS = '<svg width="10" height="10" viewBox="0 0 16 16"><path d="M8 2.5v11M2.5 8h11" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>';
const MINUS = '<svg width="10" height="10" viewBox="0 0 16 16"><path d="M2.5 8h11" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>';

let S = {
  cfg: {...CONFIG}, players: [], pmap: {}, entries: [], points: {}, reveal: false,
  lineups: [], cur: 0, pos: "QB", q: "", sort: {k: "salary", d: -1},
  sq: "", sel: null, view: "lineup", busy: false
};

const blank = () => S.cfg.slots.map(() => null);
const lu = () => S.lineups[S.cur];
const eligible = (slot, pos) => (ELIG[slot] || [slot]).includes(pos);
const salOf = l => l.reduce((a, n) => a + (n && S.pmap[n] ? S.pmap[n].salary : 0), 0);

function slotFor(p) {
  const l = lu(), sl = S.cfg.slots; let f = -1;
  for (let i = 0; i < sl.length; i++) {
    if (l[i] || !eligible(sl[i], p.pos)) continue;
    if (sl[i] === p.pos) return i;
    if (f < 0) f = i;
  }
  return f;
}

/* ===== DATA ===== */
async function load() {
  let d;
  if (CONFIG.API_URL) {
    try {
      const r = await fetch(CONFIG.API_URL + "?action=data", {cache: "no-store"});
      d = await r.json();
      if (!d.ok) throw new Error(d.error);
    } catch (e) { toast("Could not load contest"); return; }
  } else {
    let e = [];
    try { e = JSON.parse(localStorage.getItem(LS_ENT) || "[]"); } catch (_) {}
    d = {config: {}, players: [], entries: e, points: {}};
  }
  apply(d);
}

function apply(d) {
  const prev = S.cfg.slots.join();
  const c = Object.fromEntries(Object.entries(d.config || {}).filter(([, v]) => v !== "" && v != null));
  delete c.contestName;
  S.cfg = {...CONFIG, ...c};
  S.players = (d.players && d.players.length) ? d.players
    : SEED.map(([name, pos, salary, team, opp, bid, linemen]) => ({name, pos, salary, team, opp, bid: bid === "" ? null : bid, linemen: linemen || ""}));
  S.pmap = Object.fromEntries(S.players.map(p => [p.name, p]));
  S.entries = (d.entries || []).slice().sort((a, b) => (a.ts || 0) - (b.ts || 0));
  S.points = d.points || {};
  S.reveal = !!S.cfg.locked;
  if (!S.reveal) S.entries = S.entries.map(({players, ...e}) => e);
  if (!S.lineups.length || S.cfg.slots.join() !== prev) { S.lineups = [blank()]; S.cur = 0; }
  S.lineups = S.lineups.map(l => l.map(n => n && S.pmap[n] ? n : null));
  if (S.cfg.locked && S.view === "lineup") S.view = "standings";
  renderAll();
}

/* ===== RENDER ===== */
function renderAll() {
  document.title = S.cfg.contestName;
  $("#cTitle").textContent = S.cfg.contestName;
  $("#mEntries").textContent = S.entries.length.toLocaleString("en-US");
  $("#mCap").textContent = money(S.cfg.salaryCap);
  $("#mMax").textContent = S.cfg.maxEntries;
  const st = $("#mStatus");
  st.textContent = S.cfg.locked ? "Live" : "Open";
  st.className = "lv " + (S.cfg.locked ? "live2" : "open");
  $("#navLineup").classList.toggle("hide", !!S.cfg.locked);
  document.querySelectorAll(".navtab").forEach(b => b.classList.toggle("on", b.dataset.v === S.view));
  $("#vLineup").classList.toggle("hide", S.view !== "lineup");
  $("#vStand").classList.toggle("hide", S.view !== "standings");
  if (S.view === "lineup") { renderPool(); renderLineup(); }
  else renderStandings();
}

function renderPool() {
  hidePop();
  const tabs = [...new Set(S.cfg.slots)];
  if (!tabs.includes(S.pos)) S.pos = tabs[0];
  $("#ptabs").innerHTML = tabs.map(t => `<button class="ptab ${S.pos === t ? "on" : ""}" data-p="${esc(t)}">${esc(t)}</button>`).join("");

  document.querySelectorAll("#phead [data-sort]").forEach(h => {
    const on = h.dataset.sort === S.sort.k;
    h.classList.toggle("sorted", on);
    h.classList.toggle("desc", on && S.sort.d < 0);
    h.classList.toggle("asc", on && S.sort.d > 0);
  });

  const q = key(S.q), l = lu(), {k, d} = S.sort;
  const rem = S.cfg.salaryCap - salOf(l), last = l.filter(n => !n).length === 1;
  const list = S.players
    .filter(p => eligible(S.pos, p.pos) && (!q || p.name.toLowerCase().includes(q)))
    .sort((a, b) => {
      if (k === "name" || k === "pos" || k === "team" || k === "opp") {
        const x = String(a[k] || "").toLowerCase(), y = String(b[k] || "").toLowerCase();
        return x < y ? -d : x > y ? d : b.salary - a.salary;
      }
      const x = a[k] ?? -1, y = b[k] ?? -1;
      return (x - y) * d || a.name.localeCompare(b.name);
    });

  $("#plist").innerHTML = list.map(p => {
    const inL = l.includes(p.name), open = slotFor(p) >= 0 && !(last && p.salary > rem);
    const cls = inL ? "on" : (!open ? "dim" : "");
    const btn = inL ? `<span class="add rm">${MINUS}</span>` : `<span class="add ${open ? "" : "off"}">${PLUS}</span>`;
    return `<div class="row prow ${cls}" data-n="${esc(p.name)}">
      <div class="cl"><span>${esc(p.name)}</span></div>
      <div class="c-pos">${esc(p.pos)}</div>
      <div class="cl c-tm c-team">${p.team ? `${logo(p.team)}<span class="opp" data-o="${esc(p.team)}">${esc(p.team)}</span>` : "-"}</div>
      <div class="cl c-tm">${p.opp ? `${logo(p.opp)}<span class="opp" data-o="${esc(p.opp)}">${esc(p.opp)}</span>` : "-"}</div>
      <div class="r">${p.bid != null && p.bid !== "" ? money(p.bid) : "-"}</div>
      <div class="r">${money(p.salary)}</div>
      <div class="c-add">${btn}</div>
    </div>`;
  }).join("");
}

function renderLineup() {
  const L = S.lineups, max = S.cfg.maxEntries;
  $("#lutabs").innerHTML = L.map((l, i) => {
    const ok = l.every(n => n) && salOf(l) <= S.cfg.salaryCap;
    return `<div class="lutab ${i === S.cur ? "on" : ""}" data-i="${i}"><span class="dot ${ok ? "ok" : ""}"></span><span>Lineup ${i + 1}</span>${L.length > 1 ? `<span class="tx" data-x="${i}">&times;</span>` : ""}</div>`;
  }).join("") + (L.length < max ? `<button class="luadd" id="luadd">${PLUS}</button>` : "");

  const l = lu(), rem = S.cfg.salaryCap - salOf(l), open = l.filter(n => !n).length;
  const rs = $("#remSal");
  rs.textContent = money(rem);
  rs.classList.toggle("neg", rem < 0);
  $("#avgRem").textContent = open ? money(rem / open) : "$0";

  $("#slots").innerHTML = S.cfg.slots.map((s, i) => {
    const p = l[i] ? S.pmap[l[i]] : null;
    return `<div class="srow2 slot" data-i="${i}">
      <div>${esc(s)}</div>
      <div class="cl">${p ? `${logo(p.team)}<span>${esc(p.name)}</span>` : ""}</div>
      <div class="r">${p ? money(p.salary) : ""}</div>
      <div class="x">${p ? "&times;" : ""}</div>
    </div>`;
  }).join("");

  $("#bEnter").disabled = S.busy || !!S.cfg.locked;
}

function standings() {
  const cnt = {};
  S.entries.forEach(e => { const k = key(e.name); cnt[k] = (cnt[k] || 0) + 1; });
  const seen = {};
  const rows = S.entries.map((e, i) => {
    const k = key(e.name);
    seen[k] = (seen[k] || 0) + 1;
    const n = e.entry || seen[k];
    const pl = Array.isArray(e.players) ? e.players : null;
    const pts = pl ? pl.reduce((a, p) => a + (Number(S.points[p]) || 0), 0) : null;
    return {id: i, name: e.name, label: cnt[k] > 1 ? `${e.name} (${n}/${cnt[k]})` : e.name, players: pl, salary: e.salary, pts, ts: e.ts || 0};
  });
  rows.sort((a, b) => ((b.pts ?? -1e9) - (a.pts ?? -1e9)) || (a.ts - b.ts));
  rows.forEach((r, i) => { r.rank = S.reveal ? ((i && r.pts === rows[i - 1].pts) ? rows[i - 1].rank : i + 1) : null; });
  return rows;
}

function renderStandings() {
  const rows = standings();
  const drafted = {};
  let nRev = 0;
  rows.forEach(r => { if (r.players) { nRev++; r.players.forEach(p => drafted[p] = (drafted[p] || 0) + 1); } });

  if (S.sel == null || !rows.some(r => r.id === S.sel)) S.sel = rows.length ? rows[0].id : null;
  const q = key(S.sq);
  const vis = rows.filter(r => !q || r.label.toLowerCase().includes(q));

  $("#slist").innerHTML = vis.map(r => `<div class="srow sent ${r.id === S.sel ? "on" : ""}" data-id="${r.id}">
      <div>${r.rank ?? "-"}</div>
      <div class="cl"><span>${esc(r.label)}</span></div>
      <div class="r">${r.players ? money(r.salary) : "-"}</div>
      <div class="r s-pts">${fmtPts(r.pts)}</div>
    </div>`).join("");

  const r = rows.find(x => x.id === S.sel);
  const det = $("#sdetail");
  const head = (a, b) => `<div class="luh"><span class="lut">${a}</span><span class="lus">${b}</span></div>`;
  if (!r) { det.innerHTML = head("Lineup", ""); return; }
  const sub = [r.rank ? `Rank:<b>${r.rank}</b>` : "", `FPTS:<b>${fmtPts(r.pts)}</b>`].filter(Boolean).join("<i></i>");
  det.innerHTML = head(esc(r.label), sub) +
    `<div class="drow th"><div>Pos</div><div>Player</div><div class="r">%Drafted</div><div class="r">FPTS</div></div>
    <div class="slots">${S.cfg.slots.map((s, i) => {
      const n = r.players ? r.players[i] : null;
      const pct = n && nRev ? (drafted[n] / nRev * 100).toFixed(1) + "%" : "";
      const pts = n ? fmtPts(Number(S.points[n]) || 0) : "";
      return `<div class="drow dl"><div>${esc(s)}</div><div class="cl">${n ? `${logo(S.pmap[n] && S.pmap[n].team)}<span>${esc(n)}</span>` : ""}</div><div class="r">${pct}</div><div class="r b">${pts}</div></div>`;
    }).join("")}</div>`;
}

/* ===== ACTIONS ===== */
function toggle(n) {
  const l = lu(), i = l.indexOf(n);
  if (i >= 0) l[i] = null;
  else {
    const p = S.pmap[n], s = p && slotFor(p);
    if (!p || s < 0) return;
    if (l.filter(x => !x).length === 1 && p.salary > S.cfg.salaryCap - salOf(l)) return;
    l[s] = n;
    const tabs = [...new Set(S.cfg.slots)];
    const hasOpen = t => S.cfg.slots.some((x, j) => !l[j] && (x === t || eligible(t, x) || eligible(x, t)));
    if (!hasOpen(S.pos)) {
      const i0 = tabs.indexOf(S.pos);
      for (let k = 1; k <= tabs.length; k++) { const t = tabs[(i0 + k) % tabs.length]; if (hasOpen(t)) { S.pos = t; break; } }
    }
  }
  renderPool(); renderLineup();
}

async function enter() {
  const name = $("#uname").value.trim();
  const cap = S.cfg.salaryCap, max = S.cfg.maxEntries;
  if (!name) return toast("Enter your Discord name");
  const subs = [];
  for (let i = 0; i < S.lineups.length; i++) {
    const l = S.lineups[i];
    if (l.every(n => !n)) continue;
    if (l.some(n => !n)) { S.cur = i; renderAll(); return toast(`Lineup ${i + 1} is incomplete`); }
    if (salOf(l) > cap) { S.cur = i; renderAll(); return toast(`Lineup ${i + 1} is over the salary cap`); }
    subs.push(l.slice());
  }
  if (!subs.length) return toast("Lineup 1 is incomplete");
  const have = S.entries.filter(e => key(e.name) === key(name)).length;
  if (have + subs.length > max) {
    const left = Math.max(0, max - have);
    return toast(left ? `${name} has ${left} entr${left === 1 ? "y" : "ies"} remaining` : `${name} already has ${max} entries`);
  }

  S.busy = true; renderLineup();
  try {
    if (CONFIG.API_URL) {
      const r = await fetch(CONFIG.API_URL, {
        method: "POST",
        headers: {"Content-Type": "text/plain;charset=utf-8"},
        body: JSON.stringify({action: "submit", name, lineups: subs})
      });
      const d = await r.json();
      if (!d.ok) throw new Error(d.error || "Submit failed");
      apply(d.data);
    } else {
      let e = [];
      try { e = JSON.parse(localStorage.getItem(LS_ENT) || "[]"); } catch (_) {}
      let n = e.filter(x => key(x.name) === key(name)).length;
      subs.forEach(l => e.push({ts: Date.now(), name, entry: ++n, salary: salOf(l), players: l}));
      localStorage.setItem(LS_ENT, JSON.stringify(e));
      apply({config: {}, players: [], entries: e, points: {}});
    }
    try { localStorage.setItem(LS_NAME, name); } catch (_) {}
    S.lineups = [blank()]; S.cur = 0;
    $("#mt").textContent = subs.length > 1 ? "Entries Submitted" : "Entry Submitted";
    $("#mb").textContent = `${name} · ${subs.length} ${subs.length > 1 ? "Lineups" : "Lineup"}`;
    const done = S.entries.filter(e => key(e.name) === key(name)).length;
    const nx = $("#mnext");
    nx.classList.toggle("hide", done >= max);
    nx.textContent = `Draft Lineup ${done + 1}/${max}`;
    $("#ov").classList.remove("hide");
  } catch (err) {
    toast(err.message || "Submit failed");
  } finally {
    S.busy = false; renderAll();
  }
}

let popFor = null;
function showPop(el) {
  const t = el.dataset.o;
  const dst = S.players.find(p => p.team === t && p.pos === "DST");
  const ord = {QB: 0, WR: 1, RB: 2};
  const list = S.players.filter(p => p.team === t && p.pos in ord)
    .sort((a, b) => ord[a.pos] - ord[b.pos] || b.salary - a.salary);
  const pop = $("#pop");
  pop.innerHTML = `<div class="pop-h">${logo(t)}${esc(t)}</div>` + list.map(p =>
    `<div class="pop-r"><div>${esc(p.pos)}</div><div class="cl"><span>${esc(p.name)}</span></div><div class="r">${money(p.salary)}</div></div>`).join("")
    + (dst && dst.linemen ? `<div class="pop-r pop-dl"><div>DL</div><div>${esc(dst.linemen)}</div></div>` : "");
  pop.classList.remove("hide");
  const b = el.getBoundingClientRect(), w = pop.offsetWidth, ht = pop.offsetHeight;
  let x = Math.min(Math.max(8, b.left), window.innerWidth - w - 8);
  let y = b.bottom + 6;
  if (y + ht > window.innerHeight - 8) y = b.top - ht - 6;
  pop.style.left = x + "px"; pop.style.top = y + "px";
  if (popFor) popFor.classList.remove("on");
  popFor = el; el.classList.add("on");
}
function hidePop() {
  $("#pop").classList.add("hide");
  if (popFor) popFor.classList.remove("on");
  popFor = null;
}

let tt;
function toast(m) {
  const t = $("#toast");
  t.textContent = m;
  t.classList.add("show");
  clearTimeout(tt);
  tt = setTimeout(() => t.classList.remove("show"), 2800);
}

/* ===== EVENTS ===== */
const hoverable = () => matchMedia("(hover:hover)").matches;
document.querySelectorAll(".navtab").forEach(b => b.onclick = () => {
  S.view = b.dataset.v; renderAll();
  if (S.view === "standings" && CONFIG.API_URL) load();
});
$("#ptabs").onclick = e => { const b = e.target.closest("[data-p]"); if (b) { S.pos = b.dataset.p; renderPool(); } };
$("#q").oninput = e => { S.q = e.target.value; renderPool(); };
$("#qx").onclick = () => { $("#q").value = ""; S.q = ""; renderPool(); };
$("#phead").onclick = e => {
  const h = e.target.closest("[data-sort]"); if (!h) return;
  const k = h.dataset.sort, txt = ["name", "pos", "team", "opp"].includes(k);
  S.sort = S.sort.k === k ? {k, d: -S.sort.d} : {k, d: txt ? 1 : -1};
  renderPool();
};
$("#plist").onclick = e => {
  const o = e.target.closest(".opp");
  if (o && !hoverable()) { if (popFor === o) hidePop(); else showPop(o); return; }
  const r = e.target.closest(".prow"); if (r) toggle(r.dataset.n);
};
$("#plist").onmouseover = e => { const o = e.target.closest(".opp"); if (o && hoverable()) showPop(o); };
$("#plist").onmouseout = e => { const o = e.target.closest(".opp"); if (o && !o.contains(e.relatedTarget) && hoverable()) hidePop(); };
$("#plist").addEventListener("scroll", () => hidePop());
window.addEventListener("scroll", () => hidePop(), {passive: true});
document.addEventListener("click", e => { if (!e.target.closest(".opp")) hidePop(); });
$("#slots").onclick = e => {
  const s = e.target.closest(".slot"); if (!s) return;
  const i = +s.dataset.i, l = lu();
  if (l[i]) { l[i] = null; renderPool(); renderLineup(); }
  else { S.pos = S.cfg.slots[i]; renderPool(); }
};
$("#lutabs").onclick = e => {
  const x = e.target.closest("[data-x]");
  if (x) {
    const i = +x.dataset.x;
    S.lineups.splice(i, 1);
    if (S.cur >= S.lineups.length) S.cur = S.lineups.length - 1;
    else if (S.cur > i) S.cur--;
    renderPool(); renderLineup(); return;
  }
  if (e.target.closest("#luadd")) {
    if (S.lineups.length < S.cfg.maxEntries) { S.lineups.push(blank()); S.cur = S.lineups.length - 1; S.pos = S.cfg.slots[0]; }
    renderPool(); renderLineup(); return;
  }
  const t = e.target.closest(".lutab");
  if (t) { S.cur = +t.dataset.i; renderPool(); renderLineup(); }
};
$("#bClear").onclick = () => { S.lineups[S.cur] = blank(); S.pos = S.cfg.slots[0]; renderPool(); renderLineup(); };
$("#bEnter").onclick = enter;
$("#mok").onclick = () => $("#ov").classList.add("hide");
$("#mnext").onclick = () => {
  $("#ov").classList.add("hide");
  S.lineups = [blank()]; S.cur = 0; S.pos = S.cfg.slots[0]; S.view = "lineup";
  renderAll();
  $("#plist").scrollTop = 0;
};
$("#sq").oninput = e => { S.sq = e.target.value; renderStandings(); };
$("#slist").onclick = e => {
  const r = e.target.closest(".sent"); if (!r) return;
  S.sel = +r.dataset.id; renderStandings();
  if (window.innerWidth <= 900) $("#sdetail").scrollIntoView({behavior: "smooth", block: "start"});
};

try { $("#uname").value = localStorage.getItem(LS_NAME) || ""; } catch (_) {}
S.lineups = [blank()];
renderAll();
load();
setInterval(() => { if (CONFIG.API_URL && S.view === "standings") load(); }, 60000);
</script>
</body>
