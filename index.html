<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GFA Turkey Bowl</title>
<style>
:root{
  --green:#53d337;--green-d:#45bb2b;--green-tint:#effae9;
  --orange:#f46c22;--red:#e5383b;
  --hdr:#1d1d1d;--bg:#ededed;--panel:#fff;
  --line:#e2e2e2;--line2:#f0f0f0;
  --text:#1d1d1d;--muted:#6b6b6b;--faint:#a3a3a3;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:"Roboto","Helvetica Neue",Helvetica,Arial,sans-serif;font-size:14px;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
input{font-family:inherit;color:var(--text)}
.hide{display:none!important}

.nav{background:#000;height:56px;display:flex;align-items:stretch;padding:0 20px;gap:28px;position:sticky;top:0;z-index:30}
.navtab{color:#fff;font-weight:700;font-size:14px;display:flex;align-items:center;border-bottom:3px solid transparent;padding-top:3px}
.navtab.on{border-bottom-color:var(--green)}
.navtab:not(.on){color:#cfcfcf}
.navtab:hover{color:#fff}

.chead{background:var(--hdr);color:#fff}
.cwrap{max-width:1280px;margin:0 auto;padding:18px 20px;display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}
.ctitle{font-size:22px;font-weight:900;letter-spacing:-.2px}
.cmeta{display:flex;gap:32px}
.cmeta .k{display:block;font-size:11px;color:#a5a5a5;font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin-bottom:2px}
.cmeta .v{font-size:16px;font-weight:700}
.st-open{color:var(--green)}
.st-live{color:var(--orange)}

.wrap{max-width:1280px;margin:0 auto;padding:16px 20px 40px}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:16px;align-items:start}
.panel{background:var(--panel);border-radius:4px;box-shadow:0 1px 2px rgba(0,0,0,.08);overflow:hidden}
.side{position:sticky;top:72px}

.bar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 16px;border-bottom:1px solid var(--line);min-height:52px;flex-wrap:wrap}
.ptabs{display:flex;align-self:stretch}
.ptab{padding:0 14px;font-weight:700;font-size:13px;color:var(--muted);border-bottom:3px solid transparent;display:flex;align-items:center;height:52px}
.ptab.on{color:#000;border-bottom-color:var(--green)}
.ptab:hover{color:#000}
.btitle{font-weight:900;font-size:16px;height:52px;display:flex;align-items:center}
.search{position:relative;width:240px;max-width:100%}
.search input{width:100%;height:34px;border:1px solid #d4d4d4;border-radius:17px;padding:0 12px 0 34px;font-size:13px;background:#fff;outline:none}
.search input:focus{border-color:#000}
.search svg{position:absolute;left:12px;top:10px;color:var(--faint)}

.row{display:grid;grid-template-columns:48px minmax(0,1fr) 150px 150px 64px 76px 48px;align-items:center;padding:0 16px}
.thead{background:#f7f7f7;height:34px;font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.3px;border-bottom:1px solid var(--line);text-transform:uppercase}
.thead [data-sort]{cursor:pointer;user-select:none}
.thead [data-sort]:hover,.thead .sorted{color:#000}
.thead .sorted::after{content:"";display:inline-block;margin-left:5px;vertical-align:middle;border-left:4px solid transparent;border-right:4px solid transparent}
.thead .sorted.desc::after{border-top:5px solid #000}
.thead .sorted.asc::after{border-bottom:5px solid #000}
.r{text-align:right}
.plist{max-height:calc(100vh - 250px);min-height:300px;overflow-y:auto}
.prow{height:48px;border-bottom:1px solid var(--line2);cursor:pointer}
.prow:hover{background:#fafafa}
.prow.on{background:var(--green-tint)}
.prow.dim{opacity:.4;cursor:default}
.c-pos{font-weight:700;color:var(--muted);font-size:12px}
.lg{width:18px;height:18px;object-fit:contain;vertical-align:-4px;margin-right:6px;flex:none}
.pop-h .lg{width:20px;height:20px;vertical-align:-5px;margin-right:8px}
.nm{display:flex;align-items:center;min-width:0}
.nm>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ln{display:block;font-size:11px;font-weight:400;color:var(--muted);overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.c-name{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:8px}
.c-team,.c-opp,.c-bid{color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:8px}
.c-bid{padding-right:0}
.opp{cursor:pointer;border-bottom:1px dotted #b5b5b5}
.opp:hover,.opp.on{color:#000;border-bottom-color:#000}
.pop{position:fixed;z-index:40;width:260px;background:#fff;border-radius:4px;box-shadow:0 6px 24px rgba(0,0,0,.22);overflow:hidden;pointer-events:none}
.pop-h{background:var(--hdr);color:#fff;font-weight:900;font-size:14px;padding:10px 12px}
.pop-r{display:grid;grid-template-columns:34px minmax(0,1fr) 60px;align-items:center;height:34px;padding:0 12px;border-bottom:1px solid var(--line2);font-size:13px}
.pop-r:last-child{border-bottom:0}
.pop-dl{grid-template-columns:34px minmax(0,1fr);height:auto;min-height:34px;padding-top:8px;padding-bottom:8px;background:#f7f7f7}
.pop-dl .s-name{white-space:normal;font-weight:400;color:var(--muted)}
.pop-r .s-pos{font-size:11px}
.pop-r .s-name{font-size:13px}
.pop-r .r{font-weight:700}
.thead .c-team,.thead .c-opp,.thead .c-bid,.thead .s-sl{font-size:11px;color:inherit;overflow:visible}
.c-sal{font-weight:700}
.c-add{display:flex;justify-content:flex-end}
.add{width:28px;height:28px;border-radius:50%;background:var(--green);color:#000;display:flex;align-items:center;justify-content:center;flex:none}
.prow:hover .add{background:var(--green-d)}
.add.rm,.prow:hover .add.rm{background:#fff;box-shadow:inset 0 0 0 2px var(--red);color:var(--red)}
.add.off,.prow:hover .add.off{background:#dadada;color:#fff}

.lutabs{display:flex;align-items:stretch;border-bottom:1px solid var(--line);height:52px;padding:0 6px}
.lutab{display:flex;align-items:center;gap:6px;padding:0 10px;font-weight:700;font-size:13px;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.lutab.on{color:#000;border-bottom-color:var(--green)}
.lutab:hover{color:#000}
.dot{width:7px;height:7px;border-radius:50%;background:#d0d0d0}
.dot.ok{background:var(--green)}
.tx{width:18px;height:18px;border-radius:50%;font-size:14px;line-height:18px;color:var(--faint);display:flex;align-items:center;justify-content:center}
.tx:hover{background:#ececec;color:#000}
.luadd{margin-left:auto;align-self:center;width:28px;height:28px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--green);color:var(--green-d);display:flex;align-items:center;justify-content:center}
.luadd:hover{background:var(--green);color:#000}
.lusal{display:flex;justify-content:space-between;padding:12px 16px;background:#f7f7f7;border-bottom:1px solid var(--line)}
.lusal>div:last-child{text-align:right}
.lusal .k{display:block;font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.3px;text-transform:uppercase;margin-bottom:2px}
.lusal .v{font-size:18px;font-weight:900}
.lusal .neg{color:var(--red)}
.slot{display:grid;grid-template-columns:56px minmax(0,1fr) 72px 30px;align-items:center;height:50px;padding:0 16px;border-bottom:1px solid var(--line2);cursor:pointer}
.slot:not(.full){background:#fbfbfb}
.slot:hover{background:#f3f3f3}
.s-pos{font-weight:700;font-size:12px;color:var(--muted)}
.s-name{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:8px}
.s-sal{text-align:right;font-weight:700}
.s-x{display:flex;justify-content:flex-end}
.lufoot{padding:16px;display:flex;flex-direction:column;gap:12px}
.lufoot input{height:42px;border:1px solid #d4d4d4;border-radius:4px;padding:0 12px;font-size:14px;font-weight:700;outline:none}
.lufoot input:focus{border-color:#000}
.btns{display:flex;gap:10px}
.btn{height:44px;border-radius:4px;font-weight:900;font-size:15px;flex:1}
.btn.ghost{background:#fff;box-shadow:inset 0 0 0 1px #cfcfcf;color:#000;flex:0 0 110px}
.btn.ghost:hover{box-shadow:inset 0 0 0 1px #000}
.btn.go{background:var(--green);color:#000}
.btn.go:hover{background:var(--green-d)}
.btn.go:disabled{background:#dadada;color:#8a8a8a;cursor:default}

.srow{display:grid;grid-template-columns:64px minmax(0,1fr) 96px 84px;align-items:center;padding:0 16px}
.sent{height:48px;border-bottom:1px solid var(--line2);cursor:pointer}
.sent:hover{background:#fafafa}
.sent.on{background:var(--green-tint)}
.s-rank{font-weight:700;color:var(--muted)}
.s-ent{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:8px}
.s-sl{color:var(--muted);font-size:13px}
.s-pts{font-weight:900;font-size:15px}
.slist{max-height:calc(100vh - 250px);min-height:300px;overflow-y:auto}
.dhead{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);min-height:68px}
.dname{font-weight:900;font-size:16px}
.dsub{font-size:12px;color:var(--muted);font-weight:700;margin-top:3px}
.dpts{font-size:24px;font-weight:900;text-align:right;line-height:1}
.dpts span{display:block;font-size:11px;color:var(--muted);letter-spacing:.3px;margin-top:4px}
.drow{display:grid;grid-template-columns:56px minmax(0,1fr) 76px 64px;align-items:center;padding:0 16px}
.dl{height:48px;border-bottom:1px solid var(--line2)}
.dl .s-name{padding-right:8px}
.d-pct{color:var(--muted);font-size:13px}
.d-pts{font-weight:900}

.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal{background:#fff;border-radius:6px;width:360px;max-width:100%;padding:28px 24px 20px;text-align:center}
.mchk{width:52px;height:52px;border-radius:50%;background:var(--green);color:#000;display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
.mt{font-size:20px;font-weight:900}
.mb{color:var(--muted);font-weight:700;margin:6px 0 20px}
.mbtns{display:flex;flex-direction:column;gap:10px}
.modal .btn{width:100%;flex:none}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--red);color:#fff;font-weight:700;padding:12px 18px;border-radius:4px;opacity:0;pointer-events:none;transition:.2s;z-index:60;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media(max-width:1100px){
  .row{grid-template-columns:44px minmax(0,1fr) 124px 124px 56px 70px 44px}
}
@media(max-width:900px){
  .grid{grid-template-columns:1fr}
  .side{position:static}
  .plist,.slist{max-height:60vh}
  .search{width:100%;margin-bottom:10px}
  .bar{padding-top:0}
}
@media(max-width:560px){
  .wrap{padding:10px 10px 30px}
  .cmeta{gap:20px}
  .row{grid-template-columns:34px minmax(0,1fr) 92px 44px 54px 34px;padding:0 10px}
  .c-opp{font-size:12px}
  .add{width:26px;height:26px}
  .c-team{display:none}
  .ptab{padding:0 10px}
  .srow{grid-template-columns:44px minmax(0,1fr) 76px;padding:0 12px}
  .s-sl{display:none}
}
</style>
</head>
<body>

<nav class="nav">
  <button class="navtab on" data-v="lineup" id="navLineup">Lineup</button>
  <button class="navtab" data-v="standings" id="navStand">Standings</button>
</nav>

<header class="chead">
  <div class="cwrap">
    <div class="ctitle" id="cTitle"></div>
    <div class="cmeta">
      <div><span class="k">Entries</span><span class="v" id="mEntries">0</span></div>
      <div><span class="k">Salary Cap</span><span class="v" id="mCap"></span></div>
      <div><span class="k">Status</span><span class="v" id="mStatus"></span></div>
    </div>
  </div>
</header>

<main class="wrap grid" id="vLineup">
  <section class="panel">
    <div class="bar">
      <div class="ptabs" id="ptabs"></div>
      <div class="search">
        <svg width="14" height="14" viewBox="0 0 16 16"><circle cx="7" cy="7" r="5.2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M11 11l3.5 3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input id="q" placeholder="Search Players" autocomplete="off">
      </div>
    </div>
    <div class="row thead" id="phead">
      <div data-sort="pos">Pos</div>
      <div data-sort="name">Player</div>
      <div class="c-team" data-sort="team">Team</div>
      <div class="c-opp" data-sort="opp">Opp</div>
      <div class="r" data-sort="bid">Bid</div>
      <div class="r" data-sort="salary">Salary</div>
      <div></div>
    </div>
    <div class="plist" id="plist"></div>
  </section>

  <aside class="panel side">
    <div class="lutabs" id="lutabs"></div>
    <div class="lusal">
      <div><span class="k">Avg. Rem. / Player</span><span class="v" id="avgRem"></span></div>
      <div><span class="k">Rem. Salary</span><span class="v" id="remSal"></span></div>
    </div>
    <div id="slots"></div>
    <div class="lufoot">
      <input id="uname" placeholder="Discord Name" maxlength="32" autocomplete="off">
      <div class="btns">
        <button class="btn ghost" id="bClear">Clear</button>
        <button class="btn go" id="bEnter">Enter</button>
      </div>
    </div>
  </aside>
</main>

<main class="wrap grid hide" id="vStand">
  <section class="panel">
    <div class="bar">
      <div class="btitle">Standings</div>
      <div class="search">
        <svg width="14" height="14" viewBox="0 0 16 16"><circle cx="7" cy="7" r="5.2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M11 11l3.5 3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input id="sq" placeholder="Search Entries" autocomplete="off">
      </div>
    </div>
    <div class="srow thead">
      <div>Rank</div>
      <div>Entry</div>
      <div class="r s-sl">Salary</div>
      <div class="r">FPTS</div>
    </div>
    <div class="slist" id="slist"></div>
  </section>
  <aside class="panel side" id="sdetail"></aside>
</main>

<div class="ov hide" id="ov">
  <div class="modal">
    <div class="mchk"><svg width="26" height="26" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <div class="mt" id="mt"></div>
    <div class="mb" id="mb"></div>
    <div class="mbtns"><button class="btn go hide" id="mnext"></button><button class="btn ghost" id="mok">Done</button></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<div class="pop hide" id="pop"></div>

  "yams": "1572475678761287690/6db1968883a919a9c81eda388f2fbb33",
  "groovy gravys": "1573104859022893076/21f5dc3d9d2438a9339c9748292bc088",
  "mac n maniacs": "1572479333233336450/5b8a00ba67424f6e1e10a12ae2416b0f",
  "foggy pumpkins": "1572476319025860608/c8bd52d8906cc87439e22b68f4f5c276",
  "the drunkles": "1572478458892779600/755059be810907acdde913b7d4324b54",
  "the pilgrims": "1572476010555904130/87231e8e1f70e88942f936742fa58ee2",
  "baked birds": "1572477899720888420/e8644c79f99e83d8dadcc01a69bef5e9",
  "no feast no peace": "1572477144393580605/00557aa2062b5b6c139cbf9616b23d64",
  "the cranberry jams": "1573191694252384357/f1425443c2708678a337fa94a84b548b"
};
const logo = t => { const id = LOGOS[String(t || "").toLowerCase()]; return id ? `<img class="lg" src="https://cdn.discordapp.com/role-icons/${id}.webp?size=40&quality=lossless" alt="" loading="lazy" onerror="this.remove()">` : ""; };

/* ===== HELPERS ===== */
const $ = s => document.querySelector(s);
const money = n => (n < 0 ? "-$" : "$") + Math.abs(Math.round(n)).toLocaleString("en-US");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const r2 = n => Math.round(n * 100) / 100;
const fmtPts = n => n == null ? "-" : r2(n).toFixed(2);
const key = s => String(s).trim().toLowerCase();
const LS_ENT = "contest_entries_v1", LS_NAME = "contest_name_v1";
const PLUS = '<svg width="14" height="14" viewBox="0 0 16 16"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>';
const MINUS = '<svg width="14" height="14" viewBox="0 0 16 16"><path d="M3 8h10" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>';

let S = {
  cfg: {...CONFIG}, players: [], pmap: {}, entries: [], points: {}, reveal: false,
  lineups: [], cur: 0, pos: "QB", q: "", sort: {k: "salary", d: -1},
  sq: "", sel: null, view: "lineup", busy: false
};

const blank = () => S.cfg.slots.map(() => null);
const lu = () => S.lineups[S.cur];
const eligible = (slot, pos) => (ELIG[slot] || [slot]).includes(pos);
const salOf = l => l.reduce((a, n) => a + (n && S.pmap[n] ? S.pmap[n].salary : 0), 0);

function slotFor(p) {
  const l = lu(), sl = S.cfg.slots; let f = -1;
  for (let i = 0; i < sl.length; i++) {
    if (l[i] || !eligible(sl[i], p.pos)) continue;
    if (sl[i] === p.pos) return i;
    if (f < 0) f = i;
  }
  return f;
}

/* ===== DATA ===== */
async function load() {
  let d;
  if (CONFIG.API_URL) {
    try {
      const r = await fetch(CONFIG.API_URL + "?action=data", {cache: "no-store"});
      d = await r.json();
      if (!d.ok) throw new Error(d.error);
    } catch (e) { toast("Could not load contest"); return; }
  } else {
    let e = [];
    try { e = JSON.parse(localStorage.getItem(LS_ENT) || "[]"); } catch (_) {}
    d = {config: {}, players: [], entries: e, points: {}};
  }
  apply(d);
}

function apply(d) {
  const prev = S.cfg.slots.join();
  const c = Object.fromEntries(Object.entries(d.config || {}).filter(([, v]) => v !== "" && v != null));
  S.cfg = {...CONFIG, ...c};
  S.players = (d.players && d.players.length) ? d.players
    : SEED.map(([name, pos, salary, team, opp, bid, linemen]) => ({name, pos, salary, team, opp, bid: bid === "" ? null : bid, linemen: linemen || ""}));
  S.pmap = Object.fromEntries(S.players.map(p => [p.name, p]));
  S.entries = (d.entries || []).slice().sort((a, b) => (a.ts || 0) - (b.ts || 0));
  S.points = d.points || {};
  S.reveal = !CONFIG.API_URL || !!S.cfg.locked;
  if (!S.lineups.length || S.cfg.slots.join() !== prev) { S.lineups = [blank()]; S.cur = 0; }
  S.lineups = S.lineups.map(l => l.map(n => n && S.pmap[n] ? n : null));
  if (S.cfg.locked && S.view === "lineup") S.view = "standings";
  renderAll();
}

/* ===== RENDER ===== */
function renderAll() {
  document.title = S.cfg.contestName;
  $("#cTitle").textContent = S.cfg.contestName;
  $("#mEntries").textContent = S.entries.length.toLocaleString("en-US");
  $("#mCap").textContent = money(S.cfg.salaryCap);
  const st = $("#mStatus");
  st.textContent = S.cfg.locked ? "Live" : "Open";
  st.className = "v " + (S.cfg.locked ? "st-live" : "st-open");
  $("#navLineup").classList.toggle("hide", !!S.cfg.locked);
  document.querySelectorAll(".navtab").forEach(b => b.classList.toggle("on", b.dataset.v === S.view));
  $("#vLineup").classList.toggle("hide", S.view !== "lineup");
  $("#vStand").classList.toggle("hide", S.view !== "standings");
  if (S.view === "lineup") { renderPool(); renderLineup(); }
  else renderStandings();
}

function renderPool() {
  hidePop();
  const tabs = [...new Set(S.cfg.slots)];
  if (!tabs.includes(S.pos)) S.pos = tabs[0];
  $("#ptabs").innerHTML = tabs.map(t => `<button class="ptab ${S.pos === t ? "on" : ""}" data-p="${esc(t)}">${esc(t)}</button>`).join("");

  document.querySelectorAll("#phead [data-sort]").forEach(h => {
    const on = h.dataset.sort === S.sort.k;
    h.classList.toggle("sorted", on);
    h.classList.toggle("desc", on && S.sort.d < 0);
    h.classList.toggle("asc", on && S.sort.d > 0);
  });

  const q = key(S.q), l = lu(), {k, d} = S.sort;
  const rem = S.cfg.salaryCap - salOf(l), last = l.filter(n => !n).length === 1;
  const list = S.players
    .filter(p => (S.pos === "ALL" || eligible(S.pos, p.pos)) && (!q || p.name.toLowerCase().includes(q)))
    .sort((a, b) => {
      if (k === "name" || k === "pos" || k === "team" || k === "opp") {
        const x = String(a[k] || "").toLowerCase(), y = String(b[k] || "").toLowerCase();
        return x < y ? -d : x > y ? d : b.salary - a.salary;
      }
      const x = a[k] ?? -1, y = b[k] ?? -1;
      return (x - y) * d || a.name.localeCompare(b.name);
    });

  $("#plist").innerHTML = list.map(p => {
    const inL = l.includes(p.name), open = slotFor(p) >= 0 && !(last && p.salary > rem);
    const cls = inL ? "on" : (!open ? "dim" : "");
    const btn = inL ? `<span class="add rm">${MINUS}</span>` : `<span class="add ${open ? "" : "off"}">${PLUS}</span>`;
    return `<div class="row prow ${cls}" data-n="${esc(p.name)}">
      <div class="c-pos">${esc(p.pos)}</div>
      <div class="c-name">${esc(p.name)}${p.linemen ? `<span class="ln">${esc(p.linemen)}</span>` : ""}</div>
      <div class="c-team">${p.team ? `${logo(p.team)}<span class="opp" data-o="${esc(p.team)}">${esc(p.team)}</span>` : "-"}</div>
      <div class="c-opp">${p.opp ? `${logo(p.opp)}<span class="opp" data-o="${esc(p.opp)}">${esc(p.opp)}</span>` : "-"}</div>
      <div class="c-bid r">${p.bid != null && p.bid !== "" ? money(p.bid) : "-"}</div>
      <div class="c-sal r">${money(p.salary)}</div>
      <div class="c-add">${btn}</div>
    </div>`;
  }).join("");
}

function renderLineup() {
  const L = S.lineups, max = S.cfg.maxEntries;
  $("#lutabs").innerHTML = L.map((l, i) => {
    const ok = l.every(n => n) && salOf(l) <= S.cfg.salaryCap;
    return `<div class="lutab ${i === S.cur ? "on" : ""}" data-i="${i}"><span class="dot ${ok ? "ok" : ""}"></span><span>Lineup ${i + 1}</span>${L.length > 1 ? `<button class="tx" data-x="${i}">&times;</button>` : ""}</div>`;
  }).join("") + (L.length < max ? `<button class="luadd" id="luadd">${PLUS}</button>` : "");

  const l = lu(), rem = S.cfg.salaryCap - salOf(l), open = l.filter(n => !n).length;
  const rs = $("#remSal");
  rs.textContent = money(rem);
  rs.classList.toggle("neg", rem < 0);
  $("#avgRem").textContent = open ? money(rem / open) : "$0";

  $("#slots").innerHTML = S.cfg.slots.map((s, i) => {
    const p = l[i] ? S.pmap[l[i]] : null;
    return `<div class="slot ${p ? "full" : ""}" data-i="${i}">
      <div class="s-pos">${esc(s)}</div>
      <div class="s-name">${p ? `<div class="nm">${logo(p.team)}<span>${esc(p.name)}</span></div>` : ""}</div>
      <div class="s-sal">${p ? money(p.salary) : ""}</div>
      <div class="s-x">${p ? `<span class="tx">&times;</span>` : ""}</div>
    </div>`;
  }).join("");

  const b = $("#bEnter");
  b.disabled = S.busy || !!S.cfg.locked;
}

function standings() {
  const cnt = {};
  S.entries.forEach(e => { const k = key(e.name); cnt[k] = (cnt[k] || 0) + 1; });
  const seen = {};
  const rows = S.entries.map((e, i) => {
    const k = key(e.name);
    seen[k] = (seen[k] || 0) + 1;
    const n = e.entry || seen[k];
    const pl = Array.isArray(e.players) ? e.players : null;
    const pts = pl ? pl.reduce((a, p) => a + (Number(S.points[p]) || 0), 0) : null;
    return {id: i, name: e.name, label: cnt[k] > 1 ? `${e.name} (${n}/${cnt[k]})` : e.name, players: pl, salary: e.salary, pts, ts: e.ts || 0};
  });
  rows.sort((a, b) => ((b.pts ?? -1e9) - (a.pts ?? -1e9)) || (a.ts - b.ts));
  rows.forEach((r, i) => { r.rank = S.reveal ? ((i && r.pts === rows[i - 1].pts) ? rows[i - 1].rank : i + 1) : null; });
  return rows;
}

function renderStandings() {
  const rows = standings();
  const drafted = {};
  let nRev = 0;
  rows.forEach(r => { if (r.players) { nRev++; r.players.forEach(p => drafted[p] = (drafted[p] || 0) + 1); } });

  if (S.sel == null || !rows.some(r => r.id === S.sel)) S.sel = rows.length ? rows[0].id : null;
  const q = key(S.sq);
  const vis = rows.filter(r => !q || r.label.toLowerCase().includes(q));

  $("#slist").innerHTML = vis.map(r => `<div class="srow sent ${r.id === S.sel ? "on" : ""}" data-id="${r.id}">
      <div class="s-rank">${r.rank ?? "-"}</div>
      <div class="s-ent">${esc(r.label)}</div>
      <div class="r s-sl">${r.players ? money(r.salary) : "-"}</div>
      <div class="r s-pts">${fmtPts(r.pts)}</div>
    </div>`).join("");

  const r = rows.find(x => x.id === S.sel);
  const det = $("#sdetail");
  if (!r) { det.innerHTML = `<div class="dhead"><div class="dname">&nbsp;</div></div>`; return; }
  const sub = [r.rank ? `Rank ${r.rank}` : "", r.players ? money(r.salary) : ""].filter(Boolean).join(" · ");
  det.innerHTML = `<div class="dhead">
      <div><div class="dname">${esc(r.label)}</div><div class="dsub">${sub || "&nbsp;"}</div></div>
      <div class="dpts">${fmtPts(r.pts)}<span>FPTS</span></div>
    </div>
    <div class="drow thead"><div>Pos</div><div>Player</div><div class="r">%Drafted</div><div class="r">FPTS</div></div>
    ${S.cfg.slots.map((s, i) => {
      const n = r.players ? r.players[i] : null;
      const pct = n && nRev ? (drafted[n] / nRev * 100).toFixed(1) + "%" : "-";
      const pts = n ? fmtPts(Number(S.points[n]) || 0) : "-";
      return `<div class="drow dl"><div class="s-pos">${esc(s)}</div><div class="s-name">${n ? `<div class="nm">${logo(S.pmap[n] && S.pmap[n].team)}<span>${esc(n)}</span></div>` : ""}</div><div class="r d-pct">${pct}</div><div class="r d-pts">${pts}</div></div>`;
    }).join("")}`;
}

/* ===== ACTIONS ===== */
function toggle(n) {
  const l = lu(), i = l.indexOf(n);
  if (i >= 0) l[i] = null;
  else {
    const p = S.pmap[n], s = p && slotFor(p);
    if (!p || s < 0) return;
    if (l.filter(x => !x).length === 1 && p.salary > S.cfg.salaryCap - salOf(l)) return;
    l[s] = n;
    const tabs = [...new Set(S.cfg.slots)];
    const hasOpen = t => S.cfg.slots.some((x, j) => !l[j] && (x === t || eligible(t, x) || eligible(x, t)));
    if (!hasOpen(S.pos)) {
      const i0 = tabs.indexOf(S.pos);
      for (let k = 1; k <= tabs.length; k++) { const t = tabs[(i0 + k) % tabs.length]; if (hasOpen(t)) { S.pos = t; break; } }
    }
  }
  renderPool(); renderLineup();
}

async function enter() {
  const name = $("#uname").value.trim();
  const cap = S.cfg.salaryCap, max = S.cfg.maxEntries;
  if (!name) return toast("Enter your Discord name");
  const subs = [];
  for (let i = 0; i < S.lineups.length; i++) {
    const l = S.lineups[i];
    if (l.every(n => !n)) continue;
    if (l.some(n => !n)) { S.cur = i; renderAll(); return toast(`Lineup ${i + 1} is incomplete`); }
    if (salOf(l) > cap) { S.cur = i; renderAll(); return toast(`Lineup ${i + 1} is over the salary cap`); }
    subs.push(l.slice());
  }
  if (!subs.length) return toast("Lineup 1 is incomplete");
  const have = S.entries.filter(e => key(e.name) === key(name)).length;
  if (have + subs.length > max) {
    const left = Math.max(0, max - have);
    return toast(left ? `${name} has ${left} entr${left === 1 ? "y" : "ies"} remaining` : `${name} already has ${max} entries`);
  }

  S.busy = true; renderLineup();
  try {
    if (CONFIG.API_URL) {
      const r = await fetch(CONFIG.API_URL, {
        method: "POST",
        headers: {"Content-Type": "text/plain;charset=utf-8"},
        body: JSON.stringify({action: "submit", name, lineups: subs})
      });
      const d = await r.json();
      if (!d.ok) throw new Error(d.error || "Submit failed");
      apply(d.data);
    } else {
      let e = [];
      try { e = JSON.parse(localStorage.getItem(LS_ENT) || "[]"); } catch (_) {}
      let n = e.filter(x => key(x.name) === key(name)).length;
      subs.forEach(l => e.push({ts: Date.now(), name, entry: ++n, salary: salOf(l), players: l}));
      localStorage.setItem(LS_ENT, JSON.stringify(e));
      apply({config: {}, players: [], entries: e, points: {}});
    }
    try { localStorage.setItem(LS_NAME, name); } catch (_) {}
    S.lineups = [blank()]; S.cur = 0;
    $("#mt").textContent = subs.length > 1 ? "Entries Submitted" : "Entry Submitted";
    $("#mb").textContent = `${name} · ${subs.length} ${subs.length > 1 ? "Lineups" : "Lineup"}`;
    const done = S.entries.filter(e => key(e.name) === key(name)).length;
    const nx = $("#mnext");
    nx.classList.toggle("hide", done >= max);
    nx.textContent = `Draft Lineup ${done + 1}/${max}`;
    $("#ov").classList.remove("hide");
  } catch (err) {
    toast(err.message || "Submit failed");
  } finally {
    S.busy = false; renderAll();
  }
}

let popFor = null;
function showPop(el) {
  const t = el.dataset.o;
  const dst = S.players.find(p => p.team === t && p.pos === "DST");
  const list = S.players.filter(p => p.team === t && (p.pos === "WR" || p.pos === "RB"))
    .sort((a, b) => (a.pos === b.pos ? 0 : a.pos === "WR" ? -1 : 1) || b.salary - a.salary);
  const pop = $("#pop");
  pop.innerHTML = `<div class="pop-h">${logo(t)}${esc(t)}</div>` + list.map(p =>
    `<div class="pop-r"><div class="s-pos">${esc(p.pos)}</div><div class="s-name">${esc(p.name)}</div><div class="r">${money(p.salary)}</div></div>`).join("")
    + (dst && dst.linemen ? `<div class="pop-r pop-dl"><div class="s-pos">DL</div><div class="s-name">${esc(dst.linemen)}</div></div>` : "");
  pop.classList.remove("hide");
  const b = el.getBoundingClientRect(), w = pop.offsetWidth, ht = pop.offsetHeight;
  let x = Math.min(Math.max(8, b.left), window.innerWidth - w - 8);
  let y = b.bottom + 6;
  if (y + ht > window.innerHeight - 8) y = b.top - ht - 6;
  pop.style.left = x + "px"; pop.style.top = y + "px";
  if (popFor) popFor.classList.remove("on");
  popFor = el; el.classList.add("on");
}
function hidePop() {
  $("#pop").classList.add("hide");
  if (popFor) popFor.classList.remove("on");
  popFor = null;
}

let tt;
function toast(m) {
  const t = $("#toast");
  t.textContent = m;
  t.classList.add("show");
  clearTimeout(tt);
  tt = setTimeout(() => t.classList.remove("show"), 2800);
}

/* ===== EVENTS ===== */
document.querySelectorAll(".navtab").forEach(b => b.onclick = () => {
  S.view = b.dataset.v; renderAll();
  if (S.view === "standings" && CONFIG.API_URL) load();
});
$("#ptabs").onclick = e => { const b = e.target.closest("[data-p]"); if (b) { S.pos = b.dataset.p; renderPool(); } };
$("#q").oninput = e => { S.q = e.target.value; renderPool(); };
$("#phead").onclick = e => {
  const h = e.target.closest("[data-sort]"); if (!h) return;
  const k = h.dataset.sort, txt = ["name", "pos", "team", "opp"].includes(k);
  S.sort = S.sort.k === k ? {k, d: -S.sort.d} : {k, d: txt ? 1 : -1};
  renderPool();
};
$("#plist").onclick = e => {
  const o = e.target.closest(".opp");
  if (o && !matchMedia("(hover:hover)").matches) { if (popFor === o) hidePop(); else showPop(o); return; }
  const r = e.target.closest(".prow"); if (r) toggle(r.dataset.n);
};
$("#plist").onmouseover = e => { const o = e.target.closest(".opp"); if (o && matchMedia("(hover:hover)").matches) showPop(o); };
$("#plist").onmouseout = e => { const o = e.target.closest(".opp"); if (o && !o.contains(e.relatedTarget) && matchMedia("(hover:hover)").matches) hidePop(); };
$("#plist").addEventListener("scroll", () => hidePop());
window.addEventListener("scroll", () => hidePop(), {passive: true});
document.addEventListener("click", e => { if (!e.target.closest(".opp")) hidePop(); });
$("#slots").onclick = e => {
  const s = e.target.closest(".slot"); if (!s) return;
  const i = +s.dataset.i, l = lu();
  if (l[i]) { l[i] = null; renderPool(); renderLineup(); }
  else { S.pos = S.cfg.slots[i]; renderPool(); }
};
$("#lutabs").onclick = e => {
  const x = e.target.closest("[data-x]");
  if (x) {
    const i = +x.dataset.x;
    S.lineups.splice(i, 1);
    if (S.cur >= S.lineups.length) S.cur = S.lineups.length - 1;
    else if (S.cur > i) S.cur--;
    renderPool(); renderLineup(); return;
  }
  if (e.target.closest("#luadd")) {
    if (S.lineups.length < S.cfg.maxEntries) { S.lineups.push(blank()); S.cur = S.lineups.length - 1; }
    renderPool(); renderLineup(); return;
  }
  const t = e.target.closest(".lutab");
  if (t) { S.cur = +t.dataset.i; renderPool(); renderLineup(); }
};
$("#bClear").onclick = () => { S.lineups[S.cur] = blank(); renderPool(); renderLineup(); };
$("#bEnter").onclick = enter;
$("#mok").onclick = () => $("#ov").classList.add("hide");
$("#mnext").onclick = () => {
  $("#ov").classList.add("hide");
  S.lineups = [blank()]; S.cur = 0; S.pos = S.cfg.slots[0]; S.view = "lineup";
  renderAll();
  $("#plist").scrollTop = 0;
};
$("#sq").oninput = e => { S.sq = e.target.value; renderStandings(); };
$("#slist").onclick = e => {
  const r = e.target.closest(".sent"); if (!r) return;
  S.sel = +r.dataset.id; renderStandings();
  if (window.innerWidth <= 900) $("#sdetail").scrollIntoView({behavior: "smooth", block: "start"});
};

try { $("#uname").value = localStorage.getItem(LS_NAME) || ""; } catch (_) {}
S.lineups = [blank()];
renderAll();
load();
setInterval(() => { if (CONFIG.API_URL && S.view === "standings") load(); }, 60000);
</script>
